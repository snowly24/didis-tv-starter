<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Password hash maker — Didi's TV</title>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Caveat:wght@600;700&family=Playfair+Display:ital@0;1&family=VT323&display=swap">
  <link rel="stylesheet" href="../css/base.css">
  <style>
    main { max-width: 560px; margin: 0 auto; padding: 48px 20px; }
    h1 { font-family: var(--font-hand); font-size: 2.2rem; margin: 0 0 8px; }
    p { font-family: var(--font-serif); line-height: 1.55; }
    label { display: block; font-family: var(--font-hand); font-size: 1.4rem; font-weight: 700; margin: 24px 0 6px; }
    input, output {
      display: block; width: 100%; padding: 12px 14px; border-radius: 10px;
      border: 1.5px solid var(--blush-deep); background: #FFFCF6;
      font-family: var(--font-osd); font-size: 1.4rem; color: var(--cocoa);
    }
    output { min-height: 3.2em; word-break: break-all; font-size: 1.15rem; }
    .cleaned { font-family: var(--font-osd); font-size: 1.2rem; color: var(--cocoa-soft); margin: 6px 0 0; }
    button {
      margin-top: 14px; min-height: 44px; padding: 6px 20px; border: 0; border-radius: 22px; cursor: pointer;
      font-family: var(--font-hand); font-size: 1.3rem; font-weight: 700; background: var(--blush);
    }
    button:hover { background: var(--rose); color: #fff; }
    .done { font-family: var(--font-hand); font-size: 1.2rem; color: var(--cherry); margin-left: 10px; }
  </style>
</head>
<body>
  <main>
    <h1>password hash maker</h1>
    <p>Type the password. Copy the long code underneath and paste it into <code>js/config.js</code> as
       <code>passwordHash</code>, between the quotes. Capitals, spaces, dots, slashes and dashes are
       ignored, both here and on the site.</p>

    <label for="pw">password</label>
    <input id="pw" type="text" autocomplete="off" autocapitalize="none" spellcheck="false">
    <p class="cleaned" id="cleaned" aria-live="polite"></p>

    <label for="hash">hash to paste</label>
    <output id="hash" for="pw"></output>
    <button type="button" id="copy">copy</button><span class="done" id="done" aria-live="polite"></span>
  </main>

  <script src="../js/sha256.js"></script>
  <script>
    (function () {
      var pw = document.getElementById("pw");
      var out = document.getElementById("hash");
      var cleaned = document.getElementById("cleaned");
      var done = document.getElementById("done");

      pw.addEventListener("input", function () {
        var clean = DidiHash.normalize(pw.value);
        cleaned.textContent = clean ? "hashed as: " + clean : "";
        if (!clean) { out.textContent = ""; return; }
        DidiHash.sha256(clean).then(function (hash) {
          if (DidiHash.normalize(pw.value) === clean) out.textContent = hash;
        });
      });

      document.getElementById("copy").addEventListener("click", function () {
        var text = out.textContent;
        if (!text) return;
        function fallback() {
          var range = document.createRange();
          range.selectNodeContents(out);
          var sel = window.getSelection();
          sel.removeAllRanges();
          sel.addRange(range);
          var ok = false;
          try { ok = document.execCommand("copy"); } catch (e) {}
          done.textContent = ok ? "copied ♡" : "selected — press Cmd+C";
        }
        if (navigator.clipboard && window.isSecureContext) {
          navigator.clipboard.writeText(text).then(function () { done.textContent = "copied ♡"; }, fallback);
        } else {
          fallback();
        }
        setTimeout(function () { done.textContent = ""; }, 2500);
      });

      pw.focus();
    })();
  </script>
</body>
</html>
